<!DOCTYPE html>
<html>
    <body>
        <script>
            class song{
                constructor(title, artist, year){
                    this.title = title;
                    this.artist = artist;
                    this.year = year;
                }
                present(){
                    return this.title + " by " + this.artist + " (" + this.year + ")";
                }
            }
            class album extends song{
                constructor(title, artist, year, songs){
                    super(title, artist, year);
                    this.songs = songs;
                }
                present(){
                    return super.present() + " - Album with " + this.songs.length + " songs";
                }
            }
            const song1 = new song("Song 1", "paul mwai", 2020);
            const album1 = new album("Album 1", "paul mwai", 2020, [song1]);
            document.write(album1.present());
        </script>
    </body>
</html>
